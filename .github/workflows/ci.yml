name: "CI: Build and Test"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      SQL_SERVER_HOST: localhost
      SQL_SERVER_SA_PASSWORD: Pass@12345
      SQL_SERVER_DATABASE: xperience-by-kentico-labs-e2e-testing
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build admin client assets
        # The admin UI is served in embedded mode: DancingGoat.Admin.csproj embeds
        # Client/dist/** into the assembly at .NET build time. That output is not
        # committed, so the client must be compiled BEFORE "Build .NET solution" or
        # the custom admin app renders no client scripts and its E2E tests fail.
        working-directory: src/DancingGoat.Admin/Client
        run: |
          npm ci
          npm run build
      - name: Restore .NET dependencies
        working-directory: .
        run: dotnet restore
      - name: Build .NET solution
        working-directory: .
        run: dotnet build --no-restore
      - name: Restore Dancing Goat tools
        working-directory: src/DancingGoat
        run: dotnet tool restore
      - name: Start SQL Server
        run: |
          docker run --name xperience-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$SQL_SERVER_SA_PASSWORD" \
            -p 1433:1433 \
            -d mcr.microsoft.com/mssql/server:2022-latest
      - name: Wait for SQL Server
        run: |
          for attempt in {1..60}; do
            if docker exec xperience-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_SERVER_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi

            sleep 2
          done

          docker logs xperience-sql
          exit 1
      - name: Install Xperience database
        working-directory: src/DancingGoat
        env:
          KENTICO_LICENSE_FILE: ${{ secrets['KENTICO_LICENSE_FILE'] }}
        run: |
          if [ -z "$KENTICO_LICENSE_FILE" ]; then
            echo "Missing KENTICO_LICENSE_FILE secret."
            exit 1
          fi

          license_file="$(mktemp)"
          trap 'rm -f "$license_file"' EXIT
          printf '%s' "$KENTICO_LICENSE_FILE" > "$license_file"

          dotnet kentico-xperience-dbmanager -- \
            -s "$SQL_SERVER_HOST" \
            -u "sa" \
            -p "$SQL_SERVER_SA_PASSWORD" \
            -a "$SQL_SERVER_SA_PASSWORD" \
            -d "$SQL_SERVER_DATABASE" \
            --license-file "$license_file" \
            --recreate-existing-database
      - name: Install dependencies
        run: npm ci
      - name: Type-check tests
        run: npm run typecheck
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30
